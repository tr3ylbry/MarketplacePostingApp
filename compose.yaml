services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: marketplace
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - marketplace_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  marketplace_pg:
